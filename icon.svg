<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    파비콘: 수평선에 걸친 줄무늬 해 + 겹겹이 쌓인 종이 띠
    - 위쪽은 해가 뜨는 하늘, 아래쪽 네 줄의 색 띠는 팝업북 안에 세워지는 종이 겹을 뜻한다.
    - 색은 기본 색 테마(노을)의 색을 그대로 써서 표지 · 책등의 작은 해 문양과 같은 모양이 되게 했다.
    - 16px 탭 아이콘으로 줄어들어도 알아볼 수 있도록 곡선은 해 하나뿐이고 나머지는 전부 가로 직사각형이다.
  -->
  <defs>
    <!-- 해 그러데이션: 위는 연한 살구색, 아래로 갈수록 진한 주황 -->
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe2b0"/><stop offset="1" stop-color="#f08a4b"/></linearGradient>
    <!-- 수평선(y=38) 위만 보이게 자르는 영역: 해가 반쯤 잠긴 것처럼 보인다 -->
    <clipPath id="c"><rect width="64" height="38"/></clipPath>
  </defs>

  <!-- 바탕: 종이색 -->
  <rect width="64" height="64" fill="#fff1e2"/>

  <g clip-path="url(#c)">
    <!-- 해: 중심을 수평선 위(38)에 두어 위쪽 반원만 보인다 -->
    <circle cx="38" cy="38" r="20" fill="url(#s)"/>
    <!-- 해를 가로지르는 바탕색 틈 3줄: 아래로 갈수록 두꺼워져 해가 수평선 아래로 녹아드는 80년대 노을 무늬 -->
    <rect y="27" width="64" height="1.6" fill="#fff1e2"/>
    <rect y="31" width="64" height="2.2" fill="#fff1e2"/>
    <rect y="35" width="64" height="2.8" fill="#fff1e2"/>
  </g>

  <!-- 수평선 아래 종이 띠 4겹: 밝은 주황 → 다홍 → 자두 → 가장 어두운 보라 (가까울수록 어둡게) -->
  <rect y="38" width="64" height="7" fill="#e2562f"/>
  <rect y="45" width="64" height="7" fill="#a8385c"/>
  <rect y="52" width="64" height="6" fill="#6e2f62"/>
  <rect y="58" width="64" height="6" fill="#3b2350"/>
</svg>
